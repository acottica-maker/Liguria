<style>
html,body,#map{height:100%;width:100%;margin:0;padding:0}
body{font-family:Arial,sans-serif}
.legend{position:absolute;z-index:3;right:12px;top:12px;background:#fff;padding:10px 12px;border-radius:7px;box-shadow:0 1px 7px #777;line-height:23px;font-size:13px}

.station-marker{display:flex;align-items:center;white-space:nowrap;cursor:pointer;transform:translate(7px,0)}
.station-dot{width:15px;height:15px;min-width:15px;border:2px solid #333;border-radius:50%;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.station-label{margin-left:4px;padding:2px 5px;background:rgba(255,255,255,.90);border:1px solid rgba(60,60,60,.45);border-radius:3px;color:#111;font-size:11px;font-weight:600;line-height:14px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.maplibregl-popup-content{font-size:13px;line-height:1.45;min-width:220px}
#errore{display:none;position:absolute;z-index:5;left:18px;bottom:18px;background:#fff3cd;color:#664d03;padding:12px;border:1px solid #ffecb5;border-radius:5px}
</style>
</head>

const limiteRosso='2026-11-30';
const limiteArancione='2027-01-09';
function colore(scadenza){if(scadenza<=limiteRosso)return '#D7191C';if(scadenza<=limiteArancione)return '#F28E2B';return '#9E9E9E';}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[8.83,44.20],zoom:7.5});
map.addControl(new maplibregl.NavigationControl(),'top-left');
const bounds=new maplibregl.LngLatBounds();
stazioni.forEach(function(s){
  const marker=document.createElement('div'); marker.className='station-marker';
  const dot=document.createElement('span'); dot.className='station-dot'; dot.style.backgroundColor=colore(s.scadenzaISO);
  const label=document.createElement('span'); label.className='station-label'; label.textContent=s.nome+' · '+s.scadenza;
  marker.appendChild(dot); marker.appendChild(label);
  const popupHtml='<b>'+escapeHtml(s.nome)+'</b><br><b>Coordinate:</b> '+s.lat.toFixed(5)+', '+s.lon.toFixed(5)+'<br><b>Scadenza:</b> '+escapeHtml(s.scadenza)+'<br><b>Attività:</b> '+escapeHtml(s.attivita);
  const popup=new maplibregl.Popup({offset:18,maxWidth:'360px'}).setHTML(popupHtml);
  new maplibregl.Marker({element:marker,anchor:'left'}).setLngLat([s.lon,s.lat]).setPopup(popup).addTo(map);
  bounds.extend([s.lon,s.lat]);
});
if(stazioni.length){map.fitBounds(bounds,{padding:{top:70,bottom:70,left:70,right:260},maxZoom:10});}
map.on('error',function(e){console.error(e.error||e);document.getElementById('errore').style.display='block';});
